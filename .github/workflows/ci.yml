name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The compiler these sources were written for: the commit in .cancho-rev, the one place to change it.
      - name: Read the compiler pin
        id: pin
        run: echo "rev=$(tr -d "[:space:]" < .cancho-rev)" >> "$GITHUB_OUTPUT"

      - name: Cache the compiler
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/cancho-bin
          key: cancho-${{ steps.pin.outputs.rev }}-ubuntu-24.04

      - name: Check out cancho
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: alpibrusl/cancho
          ref: ${{ steps.pin.outputs.rev }}
          path: cancho

      - name: Build cancho
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd cancho
          cargo build --release -p cancho
          mkdir -p ~/cancho-bin
          cp target/release/cancho ~/cancho-bin/
          cp -r packages ~/cancho-bin/packages

      # Python is the test oracle (oracle/legacy, tests/), never the product.
      - name: Install the oracle's dependencies (lxml gives the SVD roundtrip its XSD validation)
        run: pip install jsonschema==4.26.0 lxml

      # dtc is the compile oracle of the device-tree generator (gate step 8d); cc is already on the runner.
      - name: Install dtc
        run: sudo apt-get update -q && sudo apt-get install -y -q device-tree-compiler

      # xmllint is the oracle of the CMSIS-SVD generator (gate step 8e): well-formed, and valid against the vendored XSD.
      - name: Install xmllint
        run: sudo apt-get install -y -q libxml2-utils

      # iverilog is the parse oracle of the SystemVerilog generator (gate step 8j, docs/cancho-port.md 34.5): both tools' modules must be accepted.
      - name: Install iverilog
        run: sudo apt-get install -y -q iverilog

      # Python only under oracle/ and tests/, and the legacy line count only comes down (docs/cancho-port.md, 36).
      - name: Where Python may be
        run: sh scripts/lint_python.sh

      # fmt, check, cancho test, file lengths, build; the text parser against the Python parser; the
      # conformance runner over every fixture; the JSON loader and validator against json + jsonschema;
      # the semantic checker against checker.py (byte for byte on the fixtures, then 55k mutants).
      - name: The cancho side (format, check, tests, conformance runner, differentials)
        run: CANCHO=$HOME/cancho-bin/cancho sh scripts/gate_cancho.sh

      - name: The oracle's own self-checks (the legacy generators and the reference simulator)
        run: python3 oracle/legacy/run_gate.py
